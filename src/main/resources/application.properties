# ── Application ───────────────────────────────────────────────────────
quarkus.application.name=webstore-kotlin

# ── Server ────────────────────────────────────────────────────────────
quarkus.http.port=8081

# ── OpenAPI / Swagger ─────────────────────────────────────────────────
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.swagger-ui.always-include=true

# ── Flyway ────────────────────────────────────────────────────────────
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# ── JWT ───────────────────────────────────────────────────────────────
# PRODUCTION: SmallRye JWT reads the RSA public key to verify incoming Bearer tokens.
# The key file must exist at src/main/resources/META-INF/resources/publicKey.pem
# and be generated from your real auth server (e.g. Keycloak, Auth0, Okta).
# The issuer must match the "iss" claim inside the JWT token exactly.
# These are scoped to %prod so they are never evaluated in dev or test.
#
# Example of what would go here for production:
#   %prod.mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
#   %prod.mp.jwt.verify.issuer=https://auth.mycompany.com
%prod.mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
%prod.mp.jwt.verify.issuer=https://auth.mycompany.com

# DEV / TEST — bypass JWT security completely.
#
# Problem: when mp.jwt.verify.publickey.location is defined globally (no profile
# prefix), SmallRye JWT validates and loads it at startup in ALL profiles —
# causing SRJWT02002 if the .pem file is missing, or ConfigurationException if
# the value is empty. Moving the property under %prod fixes this at the root.
#
# Here we supply an inline dummy JWKS so the extension initialises without a
# key file, and set a local issuer. No real token is ever verified because the
# %dev profile already grants permit-all on every path:
#   quarkus.http.auth.permission.permit-all.policy=permit
#
# Never use these values in production.
%dev.mp.jwt.verify.publickey={"keys":[]}
%dev.mp.jwt.verify.issuer=https://dev.local
%test.mp.jwt.verify.publickey={"keys":[]}
%test.mp.jwt.verify.issuer=https://dev.local

# ── Jackson ───────────────────────────────────────────────────────────
quarkus.jackson.serialization-inclusion=non-null

# ══════════════════════════════════════════════════════════════════════
# PROD profile — PostgreSQL
# ══════════════════════════════════════════════════════════════════════
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/webstore
%prod.quarkus.datasource.username=postgres
%prod.quarkus.datasource.password=

%prod.quarkus.hibernate-orm.database.generation=validate
%prod.quarkus.hibernate-orm.log.sql=false

# ══════════════════════════════════════════════════════════════════════
# DEV profile — H2 in-memory
# ══════════════════════════════════════════════════════════════════════
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:webstoredb;DB_CLOSE_DELAY=-1;NON_KEYWORDS=ORDER,VALUE
%dev.quarkus.datasource.username=sa
%dev.quarkus.datasource.password=

%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.flyway.enabled=false

# Allow all requests in dev (no auth required).
# quarkus.security.auth.enabled-in-dev-mode=false disables the CDI security
# interceptor that enforces @RolesAllowed/@Authenticated on resource methods.
# Without it, HTTP permit-all only bypasses the path-level HTTP auth filter but
# @RolesAllowed annotations on beans still throw 403 Forbidden.
# Never set this to false in production.
%dev.quarkus.security.auth.enabled-in-dev-mode=false
%dev.quarkus.http.auth.permission.permit-all.paths=/*
%dev.quarkus.http.auth.permission.permit-all.policy=permit

# ══════════════════════════════════════════════════════════════════════
# TEST profile — H2 in-memory
# ══════════════════════════════════════════════════════════════════════
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:webstore_test;DB_CLOSE_DELAY=-1;NON_KEYWORDS=ORDER,VALUE
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.flyway.enabled=false


# RUN APPLICATION
# gradle quarkusDev --info
# gradle quarkusDev --stacktrace

#Dev mode (H2, live reload):
#gradle quarkusDev
#Production mode (requires PostgreSQL running):

#gradle quarkusBuild
#java -jar build/quarkus-app/quarkus-run.jar

#Run tests:
#gradle test

